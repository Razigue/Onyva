name: Deploy Supabase
on:
  workflow_dispatch:
concurrency:
  group: deploy-supabase
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PRIM_API_KEY: ${{ secrets.PRIM_API_KEY }}
      PRIM_DAILY_LIMIT: ${{ vars.PRIM_DAILY_LIMIT }}
      PRIM_QUOTA_CONFIRMED: ${{ vars.PRIM_QUOTA_CONFIRMED }}
      LOCATION_SIGNING_SECRET: ${{ secrets.LOCATION_SIGNING_SECRET }}
      NOTIFICATIONS_SECRET: ${{ secrets.NOTIFICATIONS_SECRET }}
      EXPO_ACCESS_TOKEN: ${{ secrets.EXPO_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint && pnpm typecheck && pnpm test
      - run: node scripts/deploy-supabase.mjs
