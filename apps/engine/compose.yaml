# Engine service on one machine. Run from apps/engine: docker compose up -d --build
# ENGINE_SECRET comes from apps/engine/.env (never committed). The snapshot directory is built by
# `pnpm engine:build-network` and mounted read-only; `docker compose kill -s SIGHUP engine` reloads it.
# The port listens on the loopback only. On the VM, `docker compose --profile https up -d` adds Caddy,
# the HTTPS front reached by Supabase, on ENGINE_DOMAIN (see docs/engine.md, phase 3).
services:
  engine:
    build:
      context: ../..
      dockerfile: apps/engine/Dockerfile
    image: onyva-engine
    restart: unless-stopped
    environment:
      ENGINE_SECRET: ${ENGINE_SECRET:?ENGINE_SECRET requis}
      ENGINE_THREADS: ${ENGINE_THREADS:-4}
    volumes:
      - ${ENGINE_SNAPSHOT_DIR:-../../data/engine}:/data/engine:ro
    ports:
      - "127.0.0.1:8787:8787"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  caddy:
    profiles: [https]
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    depends_on: [engine]
    environment:
      ENGINE_DOMAIN: ${ENGINE_DOMAIN:?ENGINE_DOMAIN requis}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  caddy-data:
  caddy-config:
